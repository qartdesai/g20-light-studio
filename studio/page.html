<!DOCTYPE html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>G20 Light Studio</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0a1217;color:#e7f0f2;font:16px/1.4 system-ui,sans-serif}header,main{max-width:1160px;margin:auto;padding:22px}header{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid #34454a}h1{margin:0;font-size:clamp(23px,4vw,38px);letter-spacing:-.05em}h2{margin:0 0 12px;font-size:20px}h3{font-size:15px;color:#aec2c7}header span,small{color:#a8bbc0}main{display:grid;grid-template-columns:minmax(300px,.85fr) minmax(320px,1.15fr);gap:18px}section{background:#142229;border:1px solid #314148;border-radius:16px;padding:20px;margin-bottom:15px}label,button,select,input{font:inherit}button,select,input{background:#21333b;color:inherit;border:1px solid #485a61;border-radius:7px;padding:8px 10px}button,select{cursor:pointer}button:hover,button:focus-visible{border-color:#70e6c2}button[aria-pressed=true],.accent{background:#8defcb;color:#0c2820;border-color:#8defcb}.stop{border-color:#f3a794}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0}.field{display:grid;gap:5px;margin:11px 0}.bank{display:grid;grid-template-columns:1fr 1fr;gap:5px}.bank button{text-align:left;font-size:13px}.line{border-top:1px solid #32454d;padding:8px 0}.line small{display:block}.line button{font-size:13px}canvas{display:block;width:100%;height:auto}.sticky{position:sticky;top:12px}.mode{color:#8defcb}#track{width:100%}#feedback{color:#ffd098;min-height:1.4em}#monitor{min-height:3em}details{margin:10px 0}summary{cursor:pointer}label input[type=checkbox]{accent-color:#8defcb}input[type=file]{max-width:100%;font-size:13px}@media(max-width:760px){main{display:block;padding:12px}.sticky{position:static}section{padding:14px}header{padding:15px}canvas{max-height:260px}}
body{background:#f4f4f2;color:#202122;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header,main{max-width:1180px}header{border:0;padding:28px 24px 18px;align-items:center}.wordmark{display:flex;align-items:center;gap:12px}.wordmark i{width:27px;height:22px;border-radius:6px;background:repeating-linear-gradient(115deg,#202122 0 4px,transparent 4px 7px)}h1{font-size:25px;letter-spacing:-.06em}header span,small{color:#666969}main{grid-template-columns:1.12fr 1fr;gap:26px}section{background:#fff;border:0;border-radius:26px;padding:26px;box-shadow:0 3px 18px #16161505}h2{font-size:27px;letter-spacing:-.055em;font-weight:620}button,select,input{background:#f0f0ee;color:#242525;border:0;border-radius:12px;padding:12px 14px;min-height:44px}button:hover{background:#dfdfda}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #4787d1;outline-offset:2px}button.accent,button[aria-pressed=true]{background:#202122;color:white}.sticky{background:#171819;color:#fafafa;overflow:hidden}.sticky h2{margin-bottom:0}.mode{color:#aaaead}#map{margin:4px 0;max-height:365px;object-fit:contain}#monitor{font-size:14px;color:#c4c6c5;min-height:1.6em}.stop{background:#343737;color:white}.stop:hover{background:#484b4b}#progress{font-variant-numeric:tabular-nums;font-size:13px;color:#bbb}.slider{display:grid;width:100%;grid-template-columns:1fr auto;align-items:center;margin:14px 0;font-weight:550}.slider output{font-size:15px;font-variant-numeric:tabular-nums;color:#595c5a}.slider input{grid-column:1/-1;width:100%;appearance:none;background:transparent;padding:0;cursor:pointer;--fill:33%}.slider input::-webkit-slider-runnable-track{height:5px;border-radius:8px;background:linear-gradient(to right,#262829 var(--fill),#dadcda var(--fill))}.slider input::-webkit-slider-thumb{appearance:none;width:25px;height:25px;margin-top:-10px;border-radius:50%;background:white;box-shadow:0 1px 5px #0004;border:1px solid #ddd}.slider input::-moz-range-track{height:5px;background:#d5d6d4}.slider input::-moz-range-progress{background:#292b2a}nav{display:flex;background:#e5e5e2;border-radius:16px;padding:4px;margin-bottom:14px}nav button{flex:1;background:transparent}nav button[aria-pressed=true]{background:white;color:#151616;box-shadow:0 1px 5px #0001}.field,summary{font-weight:520}summary{padding:10px 0}.line,details{border-top:1px solid #dedfdd}.bank{gap:6px}#feedback{color:#815319}.row{gap:9px}.field select{width:100%}label input[type=checkbox]{accent-color:#333;min-height:0}#play{width:100%}#remove{font-size:13px}#remove:disabled{display:none}@media(max-width:760px){header{padding:18px 18px 8px}main{padding:12px}section{padding:19px;border-radius:21px}#map{height:210px}.sticky .row{margin-bottom:0}h2{font-size:24px}nav{position:sticky;top:4px;z-index:1}select,input{max-width:100%}}
</style>
<header><div class="wordmark"><i aria-hidden="true"></i><h1>Light Studio</h1></div><span>BMW G20 · 318</span></header>
<main><div><section class="sticky"><h2>Оптика</h2><small class="mode">Предпросмотр</small><canvas id="map" width="640" height="470" aria-label="Вид автомобиля сверху, передняя часть вверху"></canvas><div id="monitor"></div><div class="row"><button class="stop" id="stop">■ Стоп</button><span id="progress"></span></div></section></div>
<div><nav aria-label="Раздел"><button id="tabScenes" aria-pressed="true">Сцены</button><button id="tabEdit" aria-pressed="false">Редактор</button></nav><section id="scenesPane"><h2>Световые сцены</h2><label class="field">Выбрать сцену<select id="scene"></select></label><div class="row"><button class="accent" id="play">▶ Проиграть</button></div><label class="slider">Скорость <output id="speedValue">1×</output><input id="speed" type="range" min="0.5" max="2" step="0.05" value="1"></label><div class="row"><label><input id="loop" type="checkbox" checked> Цикл</label><label>Проходов <select id="count"><option>1</option><option>2</option><option>3</option></select></label></div><div class="row"><button id="hazard">Аварийка</button><button id="fso">ФСО · демо 4 с</button><button id="remove">Удалить сохранённую сцену</button></div>
<details><summary>В такт музыке</summary><label class="field">Аудиофайл с устройства<input id="fileAudio" type="file" accept="audio/*"></label><audio id="track" controls></audio><p id="musicStatus">Выбери трек или переключай шаги вручную.</p><div class="row"><button id="sync">▶ Под музыку</button><button id="tap">Удар вручную</button></div></details></section>
<section id="editPane" hidden><h2>Редактор сцены</h2><div class="row"><button id="copy">Загрузить выбранную сцену</button><button id="fresh">Новая сцена</button></div><label class="field">Название<input id="name" maxlength="60" value="Моя сцена"></label><details><summary>Огни для шага</summary><small>Количество сегментов в демопрофиле условное.</small><div class="bank" id="bank"></div></details><div class="row"><label class="slider">Длительность шага <output id="msValue">500 мс</output><input type="range" id="ms" min="100" max="10000" step="1" value="500"></label><button id="add">Добавить шаг</button><button id="clear">Снять выбор</button></div><small>Пустой шаг задаёт паузу. Кнопка «Выбрать» переносит шаг в редактор огней.</small><div id="steps"></div>
<div class="row"><button class="accent" id="save">Сохранить сцену</button><button id="export">Скачать JSON</button></div><label class="field">Открыть сцену из JSON<input type="file" accept=".json,application/json" id="import"></label></section><p role="status" id="feedback"></p></div></main>
<!--SCRIPTS-->
</html>
